#region 5.7mm Cartridges
- type: entity
  id: BaseCartridgeCompactRifle
  name: cartridge (5.7mm)
  parent: [ BaseCartridge, BaseSecurityContraband ]
  abstract: true
  components:
  - type: Tag
    tags:
      - Cartridge
      - CartridgeCompactRifle
  - type: CartridgeAmmo
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 10

- type: entity
  id: CartridgeCompactRifle
  name: cartridge (5.7mm FMJ)
